function openDialog(title,html,onSubmit,submit='Apply',width=460){const d=$('#editor-dialog');if(d.open)d.close();d.innerHTML=`<form id="dialog-form"><div class="dialog-header"><h2 id="dialog-title">${esc(title)}</h2><button type="button" class="icon-button" data-command="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-content">${html}</div><div class="dialog-footer"><button type="button" class="button subtle" data-command="close-dialog">Cancel</button>${onSubmit?`<button type="submit" class="button primary">${esc(submit)}</button>`:''}</div></form>`;d.style.width=width+'px';d.showModal();$('#dialog-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;if(b)b.disabled=true;try{const result=await onSubmit(new FormData(e.target));if(result!==false)d.close();}catch(err){toast(err.message||'The operation failed.',true);}finally{if(b)b.disabled=false;}});}

function textDialog(l=null,p={x:doc.w*.1,y:doc.h*.1}){if(l?.locked){toast('Unlock the text layer first.',true);return;}openDialog(l?'Edit text':'New text',`<label class="form-field">Text<textarea name="text" required>${esc(l?.text||'Your words here')}</textarea></label><div class="form-grid">${inputField('size','Size (px)',l?.fontSize||options.fontSize,'number','min="1" max="1000" required')}<label class="form-field">Font<select name="font">${fontOptions(l?.font||options.font)}</select></label>${inputField('color','Color',l?.color||options.fg,'color')}<label class="check-field"><input type="checkbox" name="bold" ${l?.bold||options.bold?'checked':''}> Bold</label></div>`,f=>{const size=clamp(f.get('size'),1,1000),text=String(f.get('text')).slice(0,10000),font=String(f.get('font'));const ctx=canvas(1,1).getContext('2d');ctx.font=`${f.has('bold')?'bold ':''}${size}px "${font}"`;const w=Math.max(30,...text.split('\n').map(s=>ctx.measureText(s).width+8)),h=text.split('\n').length*size*1.25;validateSize(w,h);const target=l||baseLayer('text',text.split('\n')[0].slice(0,40),w,h);Object.assign(target,{text,fontSize:size,font,color:String(f.get('color')),bold:f.has('bold'),w,h,align:target.align||'left'});if(!l){target.x=p.x;target.y=p.y;addLayer(target,'Add text');}else commit('Edit text');},l?'Update text':'Create text');}
function resizeDialog(){openDialog('Image size',`<div class="form-grid">${inputField('width','Width (px)',doc.w,'number','required min="1" max="16000"')}${inputField('height','Height (px)',doc.h,'number','required min="1" max="16000"')}</div><label class="check-field"><input type="checkbox" id="resize-ratio" checked> Constrain proportions</label>`,f=>{const {w,h}=validateSize(f.get('width'),f.get('height'));resizeDocument(w,h);commit('Resize image',{type:'resize',w,h});fit();});const ratio=doc.w/doc.h;$$('#dialog-form input[type=number]').forEach(el=>el.addEventListener('input',()=>{if($('#resize-ratio').checked){const other=$(`#dialog-form [name="${el.name==='width'?'height':'width'}"]`);other.value=Math.round(el.name==='width'?Number(el.value)/ratio:Number(el.value)*ratio);}}));}
